name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Test integration (race, needs redis)
        run: go test -tags=integration -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # A prebuilt golangci-lint binary is built with whatever Go
          # version *its own* release used, which can lag behind this
          # project's go.mod (a dependency graph can require a newer Go
          # than golangci-lint's latest release supports parsing export
          # data for). Building it locally with our own toolchain avoids
          # that mismatch entirely.
          install-mode: goinstall
